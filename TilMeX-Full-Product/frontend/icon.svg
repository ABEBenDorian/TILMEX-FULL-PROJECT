<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C853"/>
      <stop offset="100%" style="stop-color:#009624"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#128C7E"/>
      <stop offset="100%" style="stop-color:#075E54"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Chat bubble -->
  <path d="M50 15 C30 15 15 30 15 50 C15 60 20 68 28 74 L25 85 L38 79 C42 81 46 82 50 82 C70 82 85 67 85 50 C85 30 70 15 50 15 Z" fill="url(#grad)"/>
  
  <!-- Letter T -->
  <text x="50" y="62" font-size="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="bold">T</text>
  
  <!-- Online dot -->
  <circle cx="75" cy="25" r="10" fill="#25D366" stroke="white" stroke-width="3"/>
  
  <!-- Small decorative dots -->
  <circle cx="20" cy="20" r="3" fill="#25D366" opacity="0.8"/>
  <circle cx="80" cy="80" r="4" fill="#25D366" opacity="0.8"/>
</svg>
