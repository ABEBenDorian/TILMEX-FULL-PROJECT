services:
  - type: web
    name: tilmex
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: tilmex-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/tilmex.db
      - key: SESSION_DB_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
